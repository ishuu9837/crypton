<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Y Eswar — data scientist, researcher and AI/ML engineer building useful tools and interfaces." />
    <title>Y Eswar — Data Science &amp; AI Engineering</title>
    <style>html{background:#0b0b0c;color-scheme:dark}html[data-theme="light"]{background:#f1ecdf;color-scheme:light}</style>
    <script>
      history.scrollRestoration = "manual";
      try {
        if (localStorage.getItem("eswar-theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#f1ecdf";
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Caveat:wght@700&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Instrument+Serif:ital@1&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
